<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wara · Pedí tu menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EFDD; --card:#FFFDF6; --green-deep:#2E5A28; --green:#5E8F3C;
    --green-soft:#E9F0DC; --green-line:#CADBB2; --orange:#D5852A; --orange-soft:#FBEFDC;
    --wine:#A33A4E; --ink:#2B2A22; --muted:#85816F; --shadow:0 10px 30px -12px rgba(46,90,40,.30);
    /* Glassmorphism sutil (vidrio crema, no gris): opacidad alta = texto siempre legible */
    --glass-bg:rgba(255,253,246,.80); --glass-blur:10px;
    --glass-hi:rgba(255,255,255,.6); --glass-shadow:0 8px 24px -14px rgba(46,90,40,.32);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--cream);color:var(--ink);font-family:'Figtree',sans-serif;font-size:18px;line-height:1.45}
  body{background-image:radial-gradient(circle at 12% -5%,rgba(94,143,60,.10),transparent 40%),radial-gradient(circle at 95% 4%,rgba(213,133,42,.10),transparent 38%)}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  /* Header */
  header{position:sticky;top:0;z-index:30;background:rgba(246,239,221,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:14px 20px 10px;border-bottom:1px solid var(--green-line)}
  .brand{display:flex;align-items:center;gap:10px}
  .leaf{width:34px;height:34px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
  .logo{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow);background:var(--card)}
  .logo-big{display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;margin:4px auto 14px;box-shadow:0 14px 34px -12px rgba(46,90,40,.45);background:var(--card)}
  .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:25px;color:var(--green-deep);letter-spacing:-.5px;line-height:1}
  .brand small{display:block;font-size:11px;letter-spacing:2px;color:var(--orange);font-weight:700;text-transform:uppercase}
  .tabs{display:flex;gap:6px;margin-top:12px;background:var(--green-soft);padding:4px;border-radius:14px}
  .tabs button{flex:1;border:0;background:transparent;font-family:inherit;font-weight:700;font-size:14px;padding:9px;border-radius:11px;color:var(--green-deep);cursor:pointer;transition:.2s}
  .tabs button.on{background:var(--card);box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
  main{flex:1;padding:18px 18px 130px}
  /* Generic */
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:27px;color:var(--green-deep);line-height:1.12;margin-bottom:4px;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:15px;margin-bottom:18px}
  label.fld{display:block;font-weight:700;font-size:14px;color:var(--green-deep);margin:16px 0 7px}
  select,input{width:100%;font-family:inherit;font-size:18px;padding:15px 16px;border:2px solid var(--green-line);border-radius:15px;background:var(--card);color:var(--ink);appearance:none}
  select:focus,input:focus{outline:none;border-color:var(--green)}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{flex:1;min-width:120px;text-align:center;padding:16px 12px;border:2px solid var(--green-line);border-top-color:var(--glass-hi);border-radius:16px;background:var(--glass-bg);font-weight:700;font-size:16px;cursor:pointer;transition:.15s}
  .chip.on{border-color:var(--green);background:var(--green-soft);color:var(--green-deep)}
  /* Day progress */
  .steps{display:flex;gap:6px;margin-bottom:16px}
  .steps div{flex:1;height:6px;border-radius:6px;background:var(--green-line);transition:.3s}
  .steps div.done{background:var(--green)}
  .steps div.now{background:var(--orange)}
  .daybadge{display:inline-flex;align-items:center;gap:8px;background:var(--orange-soft);color:var(--orange);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:7px 14px;border-radius:30px;margin-bottom:10px}
  /* Menu option card */
  .opt{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;border:2px solid var(--green-line);border-top-color:var(--glass-hi);background:var(--glass-bg);border-radius:18px;padding:15px 15px;margin-bottom:11px;cursor:pointer;transition:.15s;position:relative}
  .opt:active{transform:scale(.99)}
  .opt.on{border-color:var(--green);background:var(--green-soft);box-shadow:var(--shadow)}
  .opt .num{flex:none;width:38px;height:38px;border-radius:11px;background:var(--orange-soft);color:var(--orange);font-family:'Fraunces',serif;font-weight:700;font-size:21px;display:grid;place-items:center}
  .opt.on .num{background:var(--green);color:#fff}
  .opt .cat{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--orange)}
  .opt .dish{font-size:16px;font-weight:600;line-height:1.25;color:var(--ink);margin-top:2px}
  .opt .tick{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;border:2px solid var(--green-line);display:grid;place-items:center;color:#fff;font-size:13px;transition:.15s}
  .opt.on .tick{background:var(--green);border-color:var(--green)}
  .skip{text-align:center;color:var(--muted);font-weight:600;font-size:14px;padding:12px;text-decoration:underline;cursor:pointer}
  .seclabel{font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--green-deep);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  .seclabel::before{content:"";width:18px;height:2px;background:var(--orange);border-radius:2px}
  /* Footer nav */
  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:40}
  .navbar .inner{max-width:480px;margin:0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 22%);display:flex;gap:10px}
  .btn{flex:1;border:0;font-family:inherit;font-weight:800;font-size:17px;padding:17px;border-radius:16px;cursor:pointer;transition:.15s}
  .btn.prim{background:var(--green-deep);color:#fff;box-shadow:var(--shadow)}
  .btn.prim:disabled{background:var(--green-line);color:#fff;box-shadow:none}
  .btn.ghost{flex:0 0 56px;background:var(--card);border:2px solid var(--green-line);color:var(--green-deep);font-size:22px}
  /* Summary / confirm */
  .sumcard{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));border:2px solid var(--green-line);border-top-color:var(--glass-hi);border-radius:18px;padding:6px 16px;margin-bottom:14px;box-shadow:var(--glass-shadow)}
  .sumrow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--green-soft)}
  .sumrow:last-child{border:0}
  .sumrow .d{font-weight:800;color:var(--green-deep);font-size:13px;text-transform:uppercase;letter-spacing:.5px;flex:none;width:78px}
  .sumrow .v{font-size:15px;text-align:right}
  .sumrow .v small{display:block;color:var(--muted);font-size:13px}
  .done-hero{text-align:center;padding:40px 10px 20px}
  .done-hero .circ{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:44px;display:grid;place-items:center;margin:0 auto 18px;box-shadow:var(--shadow)}
  /* Admin */
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}
  .kpi .box{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));border:2px solid var(--green-line);border-top-color:var(--glass-hi);border-radius:16px;padding:15px;box-shadow:var(--glass-shadow)}
  .kpi .box b{display:block;font-family:'Fraunces',serif;font-size:30px;color:var(--green-deep);line-height:1}
  .kpi .box span{font-size:13px;color:var(--muted);font-weight:600}
  .adminday{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));border:2px solid var(--green-line);border-top-color:var(--glass-hi);border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:var(--glass-shadow)}
  .adminday>summary{list-style:none;cursor:pointer;padding:15px 17px;font-weight:800;color:var(--green-deep);display:flex;justify-content:space-between;align-items:center;font-size:16px}
  .adminday>summary::-webkit-details-marker{display:none}
  .adminday>summary .pill{background:var(--orange-soft);color:var(--orange);font-size:13px;font-weight:800;padding:4px 11px;border-radius:20px}
  .adminbody{padding:0 17px 16px}
  .cook{margin:8px 0 14px}
  .cookrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--green-soft);font-size:15px}
  .cookrow b{font-family:'Figtree';color:var(--green-deep)}
  .cookrow .q{background:var(--green);color:#fff;font-weight:800;min-width:30px;text-align:center;border-radius:8px;padding:1px 8px}
  .deliv{font-size:14px}
  .deliv .h{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--orange);margin:12px 0 6px}
  .deliv .p{display:flex;align-items:center;gap:9px;padding:7px 0}
  .deliv .p input{width:20px;height:20px;flex:none;accent-color:var(--green)}
  .deliv .p .who{font-weight:700;flex:1}
  .deliv .p .what{color:var(--muted);font-size:13px}
  .note{background:var(--orange-soft);border-radius:14px;padding:13px 15px;font-size:14px;color:#8a5a1c;margin-bottom:16px;line-height:1.4}
  .footnote{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px 10px}
  .hide{display:none}
  .statusbar{border-radius:14px;padding:11px 15px;font-size:14px;font-weight:700;margin-bottom:16px;text-align:center}
  .statusbar.open{background:var(--green-soft);color:var(--green-deep);border:1px solid var(--green-line)}
  .statusbar.closed{background:#F6E2E6;color:var(--wine);border:1px solid #E3B9C2}
  .privbar{background:#26331f;color:#e3ecd4;border-radius:14px;padding:11px 15px;font-size:13.5px;font-weight:700;margin-bottom:16px;text-align:center}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--green-soft)}
  .prow:last-child{border:0}
  .prow .who{font-weight:700;font-size:15px}
  .prow .act{font-size:13px;font-weight:700;color:var(--green);cursor:pointer;white-space:nowrap;padding:4px 8px;border-radius:8px;background:var(--green-soft)}
  .recbox{background:var(--green-soft);border:1px solid var(--green-line);border-radius:12px;padding:12px 13px;font-size:14px;line-height:1.5;color:var(--ink);margin-top:12px}
  .obs-input{width:100%;box-sizing:border-box}
  .obsline{font-size:12.5px;color:#b06a00;background:#fff7ec;border-radius:8px;padding:4px 9px;margin:2px 0 8px 30px}
  .modtag{display:inline-block;margin-left:6px;color:#b06a00;font-weight:800;font-size:13px}
  .fixedsec{background:var(--green-soft);border:2px solid var(--green-line);border-radius:15px;padding:14px 16px;font-weight:800;color:var(--green-deep);font-size:17px}
  .aviso{background:var(--orange-soft);color:#8a5a1c;border:1px solid #EAD2A8;border-radius:14px;padding:13px 15px;font-size:15px;font-weight:700;margin-bottom:14px;display:flex;gap:8px;align-items:center;animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  /* Botón "Enviar" con pulso para que no se ignore el último paso */
  .btn.prim.pulse{animation:btnpulse 1.7s ease-in-out infinite}
  @keyframes btnpulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 5px rgba(94,143,60,.30),var(--shadow)}}
  @media (prefers-reduced-motion:reduce){.btn.prim.pulse{animation:none}}
  /* Glass: menos blur en mobile (gama media/baja) y fallback sólido si no hay soporte */
  @media (max-width:480px){ :root{--glass-blur:7px} }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .sumcard,.kpi .box,.adminday{background:var(--card)}
    header{background:var(--cream)}
  }
  /* Planilla imprimible */
  .printonly{display:none}
  @media print{
    html,body{background:#fff!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    .wrap,.navbar{display:none!important}
    .printonly{display:block!important}
    @page{size:A4;margin:13mm}
    .pblock.brk{page-break-after:always}
    .pbrand{display:flex;align-items:center;gap:11px;border-bottom:2px solid #5E8F3C;padding-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pbrand img{width:48px;height:48px;border-radius:50%;object-fit:cover;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pbrand .pname{font-family:'Fraunces',serif;font-weight:700;font-size:24px;color:#2E5A28;line-height:1}
    .pbrand .ptag{font-family:'Figtree',sans-serif;font-size:11px;color:#5a7a3c;font-weight:700;letter-spacing:.5px;display:block;margin-top:2px}
    .ptitle{font-size:16px;font-weight:800;color:#2B2A22;margin-top:8px}
    .pmeta{font-size:12px;color:#444;margin:4px 0 11px}
    .ptable{width:100%;border-collapse:collapse;font-size:12px}
    .ptable th,.ptable td{border:1px solid #8a8a8a;padding:7px 8px;text-align:left;vertical-align:top}
    .ptable th{background:#E9F0DC;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
    .ptable .c0,.ptable .cchk{text-align:center}
    .ptable .c0{width:30px}.ptable .cchk{width:72px}
    .dishsm{display:block;font-size:10px;color:#666;font-weight:400}
    .box{display:inline-block;width:16px;height:16px;border:1.5px solid #333;border-radius:3px}
    .pfoot{margin-top:16px;font-size:11px;color:#333}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img id="brandlogo" class="logo" alt="Wara">
      <div>
        <h1>Wara</h1>
        <small>Comida saludable · Salta</small>
      </div>
    </div>
    <div class="tabs">
      <button id="tab-order" class="on" onclick="setTab('order')">Hago mi pedido</button>
      <button id="tab-admin" onclick="setTab('admin')">Panel Wara</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="navbar" id="navbar"></div>
<div id="printArea" class="printonly"></div>

<script>
/* ============ LOGO WARA (incrustado) ============ */
const LOGO="logo.png";  // el archivo logo.png debe estar en la raíz del repo, junto a index.html
document.getElementById('brandlogo').src=LOGO;

/* ============ CONEXIÓN REAL (Google) ============ */
// Vacío = modo local (no guarda; sirve para probar la pantalla).
// Pegá acá la URL del Web App de Apps Script para activar el modo real.
const API_URL="https://script.google.com/macros/s/AKfycbylynEVpJc-nCqnPqUy4-aATojTwM_GBPlf3-We0EJ2Nuta-nqovdKqJUS2nADZXubi/exec";
async function guardarPedido(p){ if(!API_URL)return;
  try{ await fetch(API_URL,{method:"POST",body:JSON.stringify({accion:"pedido",nombre:p.nombre,sector:p.sector,dias:p.dias})}); }catch(e){}
}
async function guardarAusente(nombre,ausente){ if(!API_URL)return;
  try{ await fetch(API_URL,{method:"POST",body:JSON.stringify({accion:"ausente",nombre,ausente})}); }catch(e){}
}
async function refrescarPedidos(){ if(!API_URL)return;
  try{ const d=await (await fetch(API_URL)).json(); PEDIDOS=d.pedidos||[]; AUSENTES=d.ausentes||[]; }catch(e){}
}
function arrancar(){
  if(!API_URL){render();return;}
  main.innerHTML='<p style="padding:48px 20px;text-align:center;color:var(--muted)">Cargando menú de la semana…</p>';
  fetch(API_URL).then(r=>r.json()).then(d=>{
    if(d.semana)SEMANA=d.semana;
    ABRE=parseArg(d.abre); CIERRA=parseArg(d.cierra);
    APERTURA=fechaTxt(ABRE)||"viernes 12:00";
    CIERRE=fechaTxt(CIERRA)||"domingo 23:00";
    if(d.dias_activos){DIAS_ACTIVOS=String(d.dias_activos).split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);}
    if(d.dias&&d.dias.length)DIAS=d.dias;
    if(DIAS_ACTIVOS&&DIAS_ACTIVOS.length)DIAS=DIAS.filter(x=>DIAS_ACTIVOS.indexOf(x.k)>=0);
    if(d.postres)POSTRES=d.postres;
    if(d.colaboradores&&d.colaboradores.length)COLABS=d.colaboradores;
    COLABS.sort((a,b)=>a.n.localeCompare(b.n,'es'));
    if(d.sectores&&d.sectores.length)SECTORES=d.sectores;
    PEDIDOS=d.pedidos||[]; AUSENTES=d.ausentes||[];
    render();
  }).catch(e=>{
    main.innerHTML='<p style="padding:48px 20px;text-align:center;color:var(--wine);font-weight:600">No se pudo cargar. Revisá tu conexión y reintentá en un momento.</p>';
  });
}

/* ============ ACCESOS (configurables) ============ */
const CLAVE_WARA="wara2026";     // clave privada del panel (solo Wara)
const URL_PUBLICA="https://wara-pedidos.vercel.app"; // dirección pública de la página (cambiar acá si se migra a dominio propio)
const LINK_PEDIDOS=URL_PUBLICA;  // alias retro-compatible; el recordatorio usa URL_PUBLICA
const SESION_WARA="wara_panel_sesion"; // recuerda en localStorage que el panel ya se desbloqueó (corre en Vercel, no como artifact)
let waraUnlocked=(function(){try{return localStorage.getItem(SESION_WARA)==='1';}catch(e){return false;}})();
let claveErr='';
let panelTimer=null;            // intervalo de auto-refresco del panel (cada 60s); null = detenido
let ultimaActualizacion='';     // hora de la última recarga de pedidos (ej "14:32")
let AUSENTES=[];        // colaboradores marcados ausentes esta semana
let recordatorioListo=''; // texto del recordatorio generado

/* ============ DATOS DE LA SEMANA (8 al 12 jun 2026) ============ */
let SEMANA = "Semana del 8 al 12 de junio";
const CATS = {
  1:{n:"Ejecutivo"}, 2:{n:"Vegetariano"}, 3:{n:"Tradicional"}, 4:{n:"Regional"},
  5:{n:"Clásico"}, 6:{n:"Keto"}, 7:{n:"Vegano"}, D:{n:"Dieta"}, E:{n:"Ensalada"}
};
let DIAS = [
  {k:"LUN", nombre:"Lunes 8", platos:{
    1:"Cazuela de pollo y vegetales",2:"Risotto de quinoa",
    3:"Tallarines de espinaca con tuco de peceto y queso sardo",
    4:"Pastel de papa y carne con ensalada",5:"Milanesa de ternera con puré de papas",
    6:"Zapallitos rellenos con puré de coliflor",7:"Medallones de lenteja y calabaza con arroz primavera",
    D:"PM gratinadas con fideos cabello de ángel",E:"Ensalada fresca"}},
  {k:"MAR", nombre:"Martes 9", platos:{
    1:"Guiso de lentejas",2:"Milanesa de berenjena napolitana con arroz primavera",
    3:"Pollito trozado en salsa de hongos con chaucha y arroz blanco",
    4:"Empanadas de carne",5:"Milanesa de ternera con puré de papas",
    6:"Suprema rellena con zucchinis asados",7:"Ñoquis veganos con boloñesa de soja texturizada",
    D:"Bife de ternera con verduras cocidas",E:"Ensalada de pasta"}},
  {k:"MIE", nombre:"Miércoles 10", platos:{
    1:"Pollo al champiñón con vegetales salteados",2:"Milanesa de queso con ensalada",
    3:"Pastel de carne con ensalada rusa",
    4:"Albóndigas de carne en salsa de tomate reducida con arroz amarillo",
    5:"Milanesa de ternera con puré de papas",6:"Lasaña keto de pollo y vegetales",
    7:"Feijoada de poroto negro con arroz blanco",
    D:"Pollo hervido en colchón de vegetales",E:"Ensalada del chef"}},
  {k:"JUE", nombre:"Jueves 11", platos:{
    1:"Wok de carne y vegetales",2:"Calzón de choclo y queso con ensalada",
    3:"Milanesa de ternera a la napolitana con arroz primavera",
    4:"Pollo al disco con puré de papa",5:"Milanesa de ternera con puré de papas",
    6:"Tarta de pollo y vegetales con ensalada",7:"Medallones de garbanzo con ensalada",
    D:"PM hervida con arroz blanco + queso",E:"Ensalada Treviso"}},
  {k:"VIE", nombre:"Viernes 12", platos:{
    1:"Pollo al horno con vegetales asados",2:"Papas con queso y ensalada fresca",
    3:"Arepas de carne",4:"Matambre a la pizza con papas",
    5:"Milanesa de ternera con puré de papas",6:"Albóndigas cremosas con ensalada verde",
    7:"Medallones de quinoa con ensalada",D:"Merluza al vapor con puré de calabaza",E:"Ensalada Power"}}
];
let POSTRES = {P1:"Flan con dulce de leche", P2:"Fruta fresca", P3:"Gelatina"};
// Lista real Andreani: cada colaborador con su sucursal asignada
let COLABS = [
  {n:"Agostina Mirse", s:"JURAMENTO"},
  {n:"Antonella Guaymas", s:"JURAMENTO"},
  {n:"Diego Arroyo", s:"JURAMENTO"},
  {n:"Salomón Macarena", s:"JURAMENTO"},

// Fallback local (en producción se sobrescribe con los sectores de la planilla). Sucursales fijas de entrega.
let SECTORES = ["JURAMENTO","PLANTA","TAVELLA"];
function sectorDe(nombre){const c=COLABS.find(x=>x.n===nombre);return c?c.s:'';}
/* ---- Sucursales: el SECTOR de la planilla define entre cuáles rota cada persona ----
   "PLANTA"                        -> fija en PLANTA (no elige)
   "PLANTA / JURAMENTO"            -> rotativo SEMANAL: elige 1 al inicio (soporta cualquier cantidad)
   "PLANTA / JURAMENTO (diario)"   -> rotativo POR DÍA: elige la sucursal en cada día
   Tolera espacios de más y el marcador (diario) con/sin espacio y en cualquier may/min.   */
function esDiario(sec){return /\(\s*diario\s*\)/i.test(String(sec||''));}
function sucursalesDe(txt){return String(txt||'').replace(/\(\s*diario\s*\)/ig,'').split('/').map(s=>s.trim()).filter(Boolean);}
function esRotativo(nombre){return sucursalesDe(sectorDe(nombre)).length>1;}
function esRotativoDiario(nombre){return esRotativo(nombre)&&esDiario(sectorDe(nombre));}
function opcionesSucursal(nombre){return sucursalesDe(sectorDe(nombre));}
// Sucursal de ENTREGA de un pedido para un día puntual: la elegida ese día (diario) o la fija/semanal.
function sucursalPedidoDia(p,dk){const s=(p&&p.dias)?p.dias[dk]:null;return (s&&s.suc)?s.suc:((p&&p.sector)?p.sector:'');}
// Etiqueta de sucursal para mostrar en resúmenes de un pedido ya armado.
function sectorDePedido(p){if(p&&p.dias&&Object.keys(p.dias).some(k=>p.dias[k]&&p.dias[k].suc))return 'sucursal por día';return (p&&p.sector)?p.sector:'';}
// Sucursales REALES de entrega (para el Panel y la planilla impresa): expande los sectores
// combinados y descarta duplicados. Respeta el orden de aparición de la planilla.
// Incluye las sucursales ya elegidas por quienes pidieron, para que nadie desaparezca.
function sucursalesEntrega(){
  const out=[], add=s=>sucursalesDe(s).forEach(x=>{if(out.indexOf(x)<0)out.push(x);});
  (SECTORES||[]).forEach(add);
  (COLABS||[]).forEach(c=>add(c.s));
  (PEDIDOS||[]).forEach(p=>{add(p.sector);if(p.dias)Object.keys(p.dias).forEach(k=>{if(p.dias[k]&&p.dias[k].suc)add(p.dias[k].suc);});});
  return out;
}

function ahoraArg(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Argentina/Buenos_Aires'}));}
function parseArg(s){ // soporta "yyyy-MM-dd HH:mm" y "dd/MM/yyyy HH:mm:ss"
  if(!s)return null;
  const s2=String(s).trim();
  // formato ISO: 2026-06-12 12:00
  let m=s2.match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);
  // formato Sheets: 12/06/2026 12:00:00
  m=s2.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);
  return null;
}
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fechaTxt(dt){
  if(!dt)return '';
  const dd=('0'+dt.getDate()).slice(-2), mm=('0'+(dt.getMonth()+1)).slice(-2);
  const hh=('0'+dt.getHours()).slice(-2), mi=('0'+dt.getMinutes()).slice(-2);
  return DOW[dt.getDay()]+' '+dd+'/'+mm+', '+hh+':'+mi;
}
function ventanaReal(){
  if(ABRE&&CIERRA){ const n=ahoraArg(); return n>=ABRE && n<CIERRA; }
  // Respaldo por día de semana si no hay fechas cargadas
  const n=ahoraArg(), d=n.getDay(), h=n.getHours()+n.getMinutes()/60;
  if(d===5)return h>=12; if(d===6)return true; if(d===0)return h<23; return false;
}
function estaAbierto(){return MODO==='abierto'?true:MODO==='cerrado'?false:ventanaReal();}

    return `<div class="sumrow"><div class="d">${d.nombre}</div><div class="v">${v}</div></div>`;}).join('');

}
function confirmar(){
  if(!estaAbierto())return renderCerrado();
  const rotDia=esRotativoDiario(pedido.nombre);
  for(let i=0;i<DIAS.length;i++){const s=pedido.dias[DIAS[i].k];
    if(s&&s.m&&!s.skip&&!s.p){avisoDia='Te falta tocar el postre de este día 👇 (podés elegir "Sin postre").';view='dia'+i;render();return;}
    if(rotDia&&s&&s.m&&!s.skip&&!s.suc){avisoDia='Elegí en qué sucursal retirás este día 📍';view='dia'+i;render();return;}}
  const elegidos=DIAS.filter(d=>{const s=pedido.dias[d.k];return s&&s.m&&!s.skip;}).length;
  if(elegidos===0){avisoDia='Todavía no elegiste ningún menú. Tocá una opción para empezar 👆';view='dia0';render();return;}
  PEDIDOS=PEDIDOS.filter(p=>p.nombre!==pedido.nombre);
  const dias={};Object.keys(pedido.dias).forEach(k=>{
    const s=pedido.dias[k];
    const obs=(s&&s.obs?String(s.obs).trim():'');
    if(s&&s.skip) dias[k]={skip:true,obs};           // eligió "No pido este día"
    else if(s&&s.m){ dias[k]={m:s.m,p:s.p,obs}; if(s.suc) dias[k].suc=s.suc; } // menú (+ sucursal si es diario)
  });
  const nuevo={nombre:pedido.nombre,sector:pedido.sector,dias};
  PEDIDOS.push(nuevo);
  guardarPedido(nuevo);
  view='listo';render();
}

  if(!API_URL){alert('Sin conexión a la planilla.');return;}
  const btnTxt='Limpiando…';
  fetch(API_URL,{method:"POST",body:JSON.stringify({accion:"reiniciar"})})
    .then(r=>r.json()).then(()=>refrescarPedidos()).then(()=>{
      PEDIDOS=[];AUSENTES=[];recordatorioListo='';
      alert('✓ Listo. Semana nueva iniciada. Se guardó una copia de los pedidos anteriores en la planilla.');
      render();

}

function copiarRecordatorio(){
  const pidieron=PEDIDOS.map(p=>p.nombre);
  const pend=COLABS.map(c=>c.n).filter(n=>!pidieron.includes(n)&&!AUSENTES.includes(n));
  // Cada colaborador que falta, con nombre y apellido tal como figura en la planilla, en su propia línea.
  const nombres=pend.join('\n');
  // CIERRE = horario de cierre que ya usa el sistema (no hardcodeado). URL_PUBLICA = link de la app.
  const txt=`¡Hola! 🍽️\nRecordá elegir tu menú de la semana antes del cierre (${CIERRE}).\nFALTAN\n${nombres}\nEntrá acá 👇\n${URL_PUBLICA}\n¡Gracias! 🙌`;
  recordatorioListo=txt.replace(/\n/g,'<br>');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(()=>{});}
  render();
}
function imprimirPlanilla(){
  const blocks=[];
  DIAS.forEach(d=>{
    const pe=PEDIDOS.filter(p=>p.dias[d.k]);
    sucursalesEntrega().forEach(sec=>{
      const list=pe.filter(p=>sucursalPedidoDia(p,d.k)===sec).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
      if(!list.length)return;
      const viandas=list.filter(p=>p.dias[d.k]&&!p.dias[d.k].skip).length;
      const rows=list.map((p,i)=>{const s=p.dias[d.k];
        if(s&&s.skip) return `<tr><td class="c0">${i+1}</td><td>${p.nombre}</td>
          <td colspan="2" style="color:#888;font-style:italic">No pide este día</td>
          <td class="cchk">—</td><td></td></tr>`;
        return `<tr><td class="c0">${i+1}</td><td>${p.nombre}</td>
          <td><b>${s.m} · ${CATS[s.m]?CATS[s.m].n:''}</b><span class="dishsm">${d.platos[s.m]||''}</span></td>
          <td>${postreTxt(s.p)}</td><td class="cchk"><span class="box"></span></td><td>${s.obs||''}</td></tr>`;}).join('');
      blocks.push(`<div class="phead">
          <div class="pbrand"><img src="${LOGO}" alt="Wara"><div><span class="pname">Wara</span><span class="ptag">Comida saludable · Salta</span></div></div>
          <div class="ptitle">Planilla de entrega — ${d.nombre}</div>
          <div class="pmeta">Sucursal: <b>${sec}</b> · ${SEMANA} · Viandas a entregar: <b>${viandas}</b></div>
        </div>
        <table class="ptable"><thead><tr>
          <th class="c0">#</th><th>Colaborador</th><th>Menú</th><th>Postre</th><th class="cchk">Entregado</th><th>Observaciones</th>
        </tr></thead><tbody>${rows}</tbody></table>
        <div class="pfoot">Recibido por: __________________________     Firma: __________________________</div>`);
    });
  });
  const area=document.getElementById('printArea');
  area.innerHTML=blocks.map((b,i)=>`<section class="pblock${i<blocks.length-1?' brk':''}">${b}</section>`).join('')
    ||'<p style="padding:20px">Todavía no hay pedidos cargados.</p>';
  window.print();
}
function descargarComprobante(nombre){
  const p=pedidoDe(nombre);
  if(!p)return;
  const rows=DIAS.map(d=>{
    const s=p.dias[d.k];
    let menu, postre;
    if(!s){menu='<span style="color:#999">—</span>';postre='—';}
    else if(s.skip){menu='<span style="color:#999;font-style:italic">No pide este día</span>';postre='—';}
    else{menu=`<b>${menuTxt(s.m)}</b><span class="dishsm">${platoDe(d.k,s.m)}</span>${s.suc?`<span class="dishsm">📍 ${s.suc}</span>`:''}`;postre=postreTxt(s.p);}
    return `<tr><td>${d.nombre}</td><td>${menu}</td><td>${postre}</td></tr>`;
  }).join('');
  const html=`<div class="phead">
      <div class="pbrand"><img src="${LOGO}" alt="Wara"><div><span class="pname">Wara</span><span class="ptag">Comida saludable · Salta</span></div></div>
      <div class="ptitle">Comprobante de pedido</div>
      <div class="pmeta"><b>${p.nombre}</b> · ${sectorDePedido(p)} · ${SEMANA}</div>
    </div>
    <table class="ptable"><thead><tr><th>Día</th><th>Menú</th><th>Postre</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="pfoot">Pedido registrado. Ante cualquier cambio, escribí antes del cierre (${CIERRE}).</div>`;
  document.getElementById('printArea').innerHTML=`<section class="pblock">${html}</section>`;
  window.print();
}
/* ============ AVISO AL SALIR CON PEDIDO SIN ENVIAR ============ */
// ¿Hay al menos un día con un menú elegido (no "no pido")?
function hayMenuElegido(){return Object.keys(pedido.dias||{}).some(function(k){var s=pedido.dias[k];return s&&s.m&&!s.skip;});}
// ¿Está en una pantalla de edición del pedido? (algún día o el resumen, no bienvenida/enviado/ver)
function estaEditando(){return view.indexOf('dia')===0 || view==='resumen';}
// Hay pedido pendiente si está en la toma de pedido (no en el Panel), en pantalla de edición,
// y hay al menos un menú elegido sin enviar. Cubre pedidos NUEVOS y MODIFICACIONES de uno ya
// hecho (mientras no toque "Enviar"), que es cuando conviene avisar al salir.
function pedidoPendiente(){return tab==='order' && estaEditando() && hayMenuElegido();}
// beforeunload cubre cerrar pestaña / recargar / navegar afuera. En móviles el botón "atrás"
// NO dispara beforeunload (lo cubre la guardia de historial de más abajo).
// confirmandoSalida evita que, cuando el usuario ya confirmó salir con nuestro aviso, salte
// además el cartel nativo (doble aviso).
window.addEventListener('beforeunload',function(e){
  if(!confirmandoSalida && pedidoPendiente()){ e.preventDefault(); e.returnValue=''; return ''; }
});

// Guardia del botón "atrás" (celular/navegador): interceptamos el historial. Mientras haya
// pedido pendiente dejamos UNA entrada extra empujada; al tocar "atrás" se consume esa entrada
// y, en vez de salir, mostramos una confirmación clara dentro de la app. La navegación interna
// de la app (botones ← entre días/pantallas) no usa el historial, así que no se ve afectada.
let guardiaHistorial=false;    // ya hay una entrada extra empujada en el historial
let confirmandoSalida=false;   // el usuario ya confirmó salir: no volver a preguntar en beforeunload
function actualizarGuardiaSalida(){
  if(pedidoPendiente()&&!guardiaHistorial){ guardiaHistorial=true; confirmandoSalida=false; history.pushState({waraGuardia:true},''); }
}
window.addEventListener('popstate',function(){
  if(pedidoPendiente()){
    // Tocó "atrás" con el pedido a medias: preguntamos antes de dejar salir.
    if(confirm('Tu pedido todavía NO fue enviado. Si salís ahora, se pierde.\n\n¿Querés salir igual?')){
      confirmandoSalida=true; guardiaHistorial=false; history.back(); // salir de verdad
    } else {
      history.pushState({waraGuardia:true},''); // se queda: reponemos la entrada, sigue como si nada
    }
  } else {
    guardiaHistorial=false; // ya no hay nada pendiente (enviado / vacío / Panel): "atrás" normal, sin molestar
  }
});

arrancar();
</script>
